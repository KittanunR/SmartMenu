<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'self'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1A4A20">
  <title>ประวัติการสั่งซื้อ · Betagro Shop</title>
  <link rel="preload" href="assets/fonts/prompt-thai-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2216%22 fill=%22%231A4A20%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v=2026-11-03b">
  <script src="i18n.js?v=2026-11-04a" defer></script>
  <script src="history.js?v=2026-11-04a" defer></script>
</head>
<body class="member">
  <!-- Order History (Phase 4): the logged-in shop's own web orders. Needs the session from member.html; see history.js. -->
  <header class="cover cover--slim">
    <div class="cover__top">
      <p class="wordmark"><span class="wordmark__brand" lang="en">Betagro Shop</span><span class="wordmark__branch" id="shop-branch"></span></p>
      <!-- Language: a native select under the pill, so phones show their own picker. -->
      <label class="lang">
        <svg class="lang__icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.4 2.5 3.6 5.5 3.6 9s-1.2 6.5-3.6 9c-2.4-2.5-3.6-5.5-3.6-9S9.6 5.5 12 3z"/></svg>
        <span class="lang__now" id="lang-now">ไทย</span>
        <svg class="lang__chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg>
        <select class="lang__select" id="lang-select" aria-label="Language · ภาษา · 言語 · 语言 · 언어 · भाषा">
          <option value="th" lang="th">ไทย</option>
          <option value="en" lang="en">English</option>
          <option value="ja" lang="ja">日本語</option>
          <option value="zh" lang="zh">中文</option>
          <option value="ko" lang="ko">한국어</option>
          <option value="hi" lang="hi">हिन्दी</option>
        </select>
      </label>
    </div>
  </header>

  <main class="page history-page">
    <a class="back-btn" href="./">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M15 5l-7 7 7 7"/></svg>
      <span data-t="backToMenu"></span>
    </a>
    <h1 class="member__title" data-t="title"></h1>
    <p class="member__intro" id="h-sub"></p>

    <p class="history__status" id="h-loading" role="status"><span class="spinner spinner--dark" aria-hidden="true"></span><span data-t="loading"></span></p>
    <div class="notice" id="h-message" role="alert" hidden></div>
    <a class="order-btn member__go" id="h-login" href="member.html" data-t="login" hidden></a>
    <button class="text-btn" id="h-retry" type="button" data-t="retry" hidden></button>

    <!-- Analytics (Phase 5): worked out in history.js from the same orders as the list below; no extra request. -->
    <section class="stats" id="h-stats" aria-labelledby="stats-title" hidden>
      <h2 class="stats__title" id="stats-title" data-t="statsTitle"></h2>
      <div class="kpis">
        <p class="kpi"><span class="kpi__label" data-t="kTotal"></span><span class="kpi__value" id="k-total"></span></p>
        <p class="kpi"><span class="kpi__label" data-t="kOrders"></span><span class="kpi__value" id="k-orders"></span></p>
        <p class="kpi"><span class="kpi__label" data-t="kAvg"></span><span class="kpi__value" id="k-avg"></span></p>
      </div>
      <figure class="weekly">
        <figcaption class="stats__sub" data-t="weekly"></figcaption>
        <div class="weekly__bars" id="w-bars"></div>
        <div class="weekly__axis" id="w-axis" aria-hidden="true"></div>
        <p class="weekly__read" id="w-read" aria-live="polite"></p>
      </figure>
      <h3 class="stats__sub" data-t="cats"></h3>
      <ul class="cats" id="cats"></ul>
      <h3 class="stats__sub" data-t="top"></h3>
      <ol class="top" id="top"></ol>
      <p class="stats__note" id="stats-note"></p>
    </section>
    <h2 class="history__head" id="h-head" data-t="ordersTitle" hidden></h2>

    <ol class="history" id="h-list" hidden></ol>
    <p class="member__help" id="h-limit" data-t="limit" hidden></p>
  </main>

  <!-- Complaint (2026-11-03): one delivered order's problem + 1–3 photos → Member.gs 'complain'. Filled by history.js. -->
  <dialog class="sheet cp" id="cp" aria-labelledby="cp-title">
    <div class="sheet__body">
      <button class="sheet__close" id="cp-close" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></svg>
        <span class="sr-only" data-t="cpClose"></span>
      </button>
      <form id="cp-form" novalidate>
        <h2 class="cp__title" id="cp-title" data-t="cpTitle"></h2>
        <p class="cp__order" id="cp-order"></p>
        <fieldset class="cp__group">
          <legend class="cp__legend" data-t="cpWhy"></legend>
          <div class="cp__reasons" id="cp-reasons"></div>
        </fieldset>
        <fieldset class="cp__group">
          <legend class="cp__legend" data-t="cpWhat"></legend>
          <p class="field__hint" data-t="cpWhatHint"></p>
          <ul class="cp__items" id="cp-items"></ul>
        </fieldset>
        <fieldset class="cp__group">
          <legend class="cp__legend" data-t="cpPhotos"></legend>
          <p class="field__hint" data-t="cpPhotosHint"></p>
          <ul class="cp__photos" id="cp-photos"></ul>
          <label class="add-btn cp__add" id="cp-add">
            <input class="sr-only" type="file" id="cp-file" accept="image/*" multiple>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
            <span data-t="cpAddPhoto"></span>
          </label>
        </fieldset>
        <div class="field">
          <label for="cp-note" id="cp-note-label"></label>
          <textarea id="cp-note" maxlength="400" rows="3"></textarea>
        </div>
        <p class="form__error" id="cp-error" role="alert" hidden></p>
        <button class="order-btn" id="cp-send" type="submit"></button>
        <p class="field__hint cp__privacy" data-t="cpPrivacy"></p>
      </form>
      <div class="cp__done" id="cp-done" hidden>
        <h2 class="cp__title" data-t="cpDoneTitle"></h2>
        <p class="cp__order" id="cp-done-body"></p>
        <button class="order-btn" id="cp-ok" type="button" data-t="cpOk"></button>
      </div>
    </div>
  </dialog>
</body>
</html>

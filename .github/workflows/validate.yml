name: validate
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # validate.mjs uses Node built-ins only, so no npm install is needed.
      - run: node scripts/validate.mjs

<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A5A32">
  <meta name="description" content="Betagro Shop Sukhumvit — weekly wholesale prices for pork, chicken and eggs, with quantity discounts.">
  <title>Betagro Shop Price Menu</title>
  <link rel="preload" href="assets/fonts/plex-thai-thai-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="masthead">
    <div class="masthead__bar">
      <p class="shop" id="shop-name">Betagro Shop</p>
      <div class="lang" role="group" aria-label="Language / ภาษา">
        <button type="button" data-lang="th" lang="th">ไทย</button>
        <button type="button" data-lang="en" lang="en">EN</button>
      </div>
    </div>
    <h1 class="asof">
      <span class="asof__label" id="asof-label"></span>
      <span class="asof__date" id="asof-date"></span>
    </h1>
    <p class="cadence" id="cadence"></p>
  </header>

  <nav class="tabs" role="tablist" id="tabs" aria-label="Categories"></nav>

  <main class="sheet">
    <div class="notice" id="notice" role="status" hidden></div>
    <div class="search">
      <svg class="search__icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15zm5.3-2.2L21 21"/></svg>
      <input class="search__input" id="search" type="search" autocomplete="off" enterkeyhint="search" aria-label="Search products / ค้นหาสินค้า">
    </div>
    <ul class="list" id="list" role="tabpanel" aria-live="polite"></ul>
    <p class="fineprint" id="fineprint"></p>
    <noscript><p class="notice">Please enable JavaScript to see prices. / กรุณาเปิด JavaScript เพื่อดูราคา</p></noscript>
  </main>

  <div class="cta-dock">
    <a class="cta" id="line-cta" href="#" target="_blank" rel="noopener">
      <svg class="cta__icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3C6.48 3 2 6.6 2 11.04c0 3.98 3.55 7.31 8.35 7.94.33.07.77.22.88.5.1.25.07.65.03.9l-.14.85c-.04.25-.2.98.86.53 1.06-.45 5.73-3.37 7.82-5.78C21.24 14.4 22 12.8 22 11.04 22 6.6 17.52 3 12 3zM8.3 13.4H6.3a.52.52 0 0 1-.52-.52V9.04a.52.52 0 1 1 1.04 0v3.32H8.3a.52.52 0 1 1 0 1.04zm2.07-.52a.52.52 0 1 1-1.04 0V9.04a.52.52 0 1 1 1.04 0v3.84zm4.8 0a.52.52 0 0 1-.94.31l-1.97-2.68v2.37a.52.52 0 1 1-1.04 0V9.04a.52.52 0 0 1 .94-.31l1.97 2.68V9.04a.52.52 0 1 1 1.04 0v3.84zm3.23-2.44a.52.52 0 1 1 0 1.04h-1.48v.88h1.48a.52.52 0 1 1 0 1.04H16.4a.52.52 0 0 1-.52-.52V9.04c0-.29.23-.52.52-.52h2a.52.52 0 1 1 0 1.04h-1.48v.88h1.48z"/></svg>
      <span id="cta-label">สั่งซื้อทาง LINE</span>
    </a>
  </div>
</body>
</html>
